[package]
name = "gitview"
version = "0.4.0"
description = "A fleet-first git client"
authors = ["Jacob Poteet"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gitview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Only for the native folder picker behind "Add a folder".
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reads only. Network operations go through git.exe, see the Git Layer note in the wiki.
git2 = { version = "0.19", default-features = false }

rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
parking_lot = "0.12"
anyhow = "1"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
