[package]
name = "gitview"
version = "0.6.0"
description = "A fleet-first git client"
authors = ["Jacob Poteet"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gitview_lib"
# The template's staticlib and cdylib are for mobile. Under fat LTO each one
# cost a whole-program pass of its own, and nothing on Windows links them.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Only for the native folder picker behind "Add a folder".
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reads only. Network operations go through git.exe, see the Git Layer note in the wiki.
git2 = { version = "0.19", default-features = false }

rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
parking_lot = "0.12"
anyhow = "1"
dirs = "5"
# The shell's Paste. `navigator.clipboard.readText()` makes WebView2 raise a
# browser permission dialog over the window; reading it here does not.
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
# One unit put the app crate's 68 s on a single thread for a 0.9% smaller exe.
codegen-units = 16
panic = "abort"
strip = true
