name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows is the only target so far, and it is the only runner with the MSVC
    # linker and a WebView2 runtime already present.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        # Reads rust-toolchain.toml at the repository root.
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Pull requests restore main's cache and never write their own. Each
          # write is about a gigabyte, and the repository's 10 GB cap would
          # otherwise evict main's after a handful of open PRs.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and bundle the frontend
        run: npm run build:vite

      - name: Lint the frontend
        run: npm run lint

      - name: TypeScript tests
        run: npm test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the app
        # Debug profile, so it reuses what cargo test compiled. The release
        # profile (LTO, opt-level "s") rebuilt every dependency a second time;
        # release.yml still builds it on every tag.
        run: npm run tauri build -- --debug --no-bundle

      - name: Smoke test the fleet scanner
        working-directory: src-tauri
        # Scans the checkout's own parent, which holds exactly one repository.
        run: cargo run --example scan -- ..
